<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Hackl</title>
    <link rel="stylesheet" href="/main.css" />
  </head>
  <body>
    <header id="topbar">
      <span id="brand">Hackl</span>
      <span id="conn" class="muted">connecting...</span>
      <span class="spacer"></span>
      <button id="engine-toggle" type="button">Engine</button>
      <span id="meter" class="muted"></span>
    </header>
    <div id="yolo-banner" hidden>
      Yolo mode: commands run with no policy and no approval. You are responsible for what happens.
    </div>
    <section id="engine-panel" hidden>
      <div class="engine-row">
        <strong>Local engine</strong>
        <span id="engine-status" class="muted">checking...</span>
      </div>
      <div class="engine-row">
        <label>Model for next start
          <select id="engine-model"></select>
        </label>
      </div>
      <pre id="engine-log" aria-live="polite"></pre>
    </section>
    <main id="thread"></main>
    <div id="empty" class="muted">Ask Hackl about this workspace, or give it a task.</div>
    <form id="composer">
      <textarea id="prompt" rows="1" placeholder="Message Hackl" autocomplete="off"></textarea>
      <div id="composer-row">
        <select id="mode" aria-label="Mode"></select>
        <span class="spacer"></span>
        <button id="cancel" type="button" hidden>Stop</button>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
    <script src="/main.js"></script>
  </body>
</html>
