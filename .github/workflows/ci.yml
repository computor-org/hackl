name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # npm 11 (pinned below) age gate: any tree npm resolves without a lockfile in CI
  # (e.g. the ad-hoc `npx electron-builder`) only takes versions >= 7 days old.
  # `npm ci` itself installs the exact lockfile tree.
  NPM_CONFIG_MIN_RELEASE_AGE: "7"

jobs:
  engine-session:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run build -w @hackl/core
      - run: node --test packages/core/tests/engineSession.test.cjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # npm >= 11 honors the package.json "allowScripts" allowlist and blocks
      # unapproved dependency install scripts; the bundled npm 10 does not.
      - run: npm install -g npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:coverage
      - run: npm run bundle -w @hackl/desktop
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:extension
      - run: npm run package:vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hackl-vsix
          path: "*.vsix"
