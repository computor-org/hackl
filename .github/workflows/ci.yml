name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: xvfb-run -a npm run test:extension
      - run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: hackl-vsix
          path: "*.vsix"
