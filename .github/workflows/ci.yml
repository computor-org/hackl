name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # npm >= 11 honors the package.json "allowScripts" allowlist and blocks
      # unapproved dependency install scripts; the bundled npm 10 does not.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:coverage
      - run: npm run bundle -w @hackl/desktop
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:extension
      - run: npm run package:vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hackl-vsix
          path: "*.vsix"
