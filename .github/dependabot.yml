# Dependabot version updates with a supply-chain cooldown.
#
# `cooldown` delays *version* updates until a release has aged; it does not
# apply to *security* updates, which open as soon as an advisory is published
# (GitHub docs: dependabot-options-reference#cooldown).

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    ignore:
      # vsce refuses to package when @types/vscode exceeds engines.vscode (VS Code 1.139);
      # raise both together. npm has no 1.139.x types release, so ~1.138.0 is the floor.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node types track the oldest supported runtime (engines.node >=22), so newer APIs fail to type-check.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
